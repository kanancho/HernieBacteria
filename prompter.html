<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teleprómpter Flotante Superpuesto</title>
    <style>
        /* Fondo negro sólido que se volverá traslúcido con el control de Samsung */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: Arial, sans-serif; color: #fff; }
        
        /* Contenedor del texto de lectura */
        .prompter-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; background: #000; }
        #text-display { color: #fff; font-size: 24px; font-weight: bold; text-align: center; width: 100%; height: 85%; overflow-y: auto; white-space: pre-wrap; scroll-behavior: smooth; }
        
        /* Pantalla de configuración inicial */
        .setup-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: #1e1e24; color: white; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; align-items: center; padding-top: 40px; gap: 15px; }
        textarea { width: 95%; height: 50%; max-width: 600px; font-size: 16px; padding: 15px; border-radius: 8px; border: none; background: #2b2b36; color: #fff; resize: none; box-sizing: border-box; }
        button.start-btn { padding: 15px; font-size: 18px; background: #00bcd4; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; width: 95%; max-width: 600px; }
    </style>
</head>
<body>

    <div class="setup-screen" id="setup">
        <h2>Prómpter para Cámara Nativa</h2>
        <p>Pega tu texto y presiona iniciar. Luego activa la vista emergente de tu Samsung.</p>
        <textarea id="text-input" placeholder="Pega tu guion aquí..."></textarea>
        <button class="start-btn" onclick="startPrompter()">Iniciar Lectura</button>
    </div>

    <div class="prompter-container" id="prompter-view" style="display:none;">
        <div id="text-display"></div>
    </div>

    <script>
        function startPrompter() {
            const text = document.getElementById('text-input').value;
            if(!text) return alert("Por favor, ingresa un texto.");
            
            document.getElementById('setup').style.display = 'none';
            document.getElementById('prompter-view').style.display = 'flex';
            
            const display = document.getElementById('text-display');
            display.innerText = text;

            // Desplazamiento automático optimizado
            display.scrollTop = 0;
            setTimeout(() => {
                let scrollInterval = setInterval(() => {
                    display.scrollTop += 1;
                    if (display.scrollTop >= display.scrollHeight - display.clientHeight) {
                        clearInterval(scrollInterval);
                    }
                }, 35); // Velocidad estándar de locución
            }, 1500); // Espera segundo y medio antes de arrancar
        }
    </script>
</body>
</html>
